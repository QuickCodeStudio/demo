name: "FinanceSettlementModule - Build and Deploy"

on:
  workflow_call:
 
env:
  PROJECT_ID: main-quickcode
  PROJECT_NAME: demo
  GAR_LOCATION: europe-west1
  SERVICE: demo-finance-settlement-module
  REGION: europe-west1
  REPO: main-quickcode-docker-repo
  DOCKER_IMAGE_NAME: 'demo_finance-settlement-module_'
  DOCKER_REPO_NAME: api
  DOCKER_FILE_PATH: 'src/Modules/FinanceSettlementModule/Presentation/QuickCode.Demo.FinanceSettlementModule.Api/'
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
  QUICKCODE_SESSION_ID: ${{ secrets.QUICKCODE_SESSION_ID }}
  QUICKCODE_RUN_ID: ${{ secrets.QUICKCODE_RUN_ID }}
  BUILD_STEP_NAME: BuildAndPushContainerModuleApi
  DEPLOY_STEP_NAME: DeployToCloudRunModuleApi
  STEP_PARAMS: FinanceSettlementModule
  READ_CONNECTION_STRING: ${{secrets.QUICKCODE_FINANCE_SETTLEMENT_MODULE_DB}}
  WRITE_CONNECTION_STRING: ${{secrets.QUICKCODE_FINANCE_SETTLEMENT_MODULE_DB}}
  ELASTIC_CONNECTION_STRING: ${{secrets.QUICKCODE_FINANCE_SETTLEMENT_MODULE_ELASTIC}}
  QUICKCODE_GATEWAY_JWT_PUBLIC_KEY: ${{secrets.QUICKCODE_GATEWAY_JWT_PUBLIC_KEY}}
  BLOB_PROVIDER: ${{ secrets.BLOB_PROVIDER }}
  AZURE_ACCOUNT_NAME: ${{ secrets.AZURE_ACCOUNT_NAME }}
  AZURE_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY }}
  AZURE_BLOB_CONTAINER_NAME: ${{ secrets.AZURE_BLOB_CONTAINER_NAME }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
  R2_KEY_PREFIX: ${{ secrets.R2_KEY_PREFIX }}
  
jobs:
  deploy:
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            src:
              - '.github/**'
              - 'src/Shared/**'
              - 'src/Modules/FinanceSettlementModule/**'

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ env.WIF_PROVIDER }}' # e.g. - projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: '${{ env.WIF_SERVICE_ACCOUNT }}' 
          
      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'
      
      - name: Build and Push Container Started
        if: always()
        run: |
          curl -f -S --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject?projectName=${{ env.PROJECT_NAME }}&step=${{ env.BUILD_STEP_NAME }}&stepParameters=${{ env.STEP_PARAMS }}&isCompleted=false&message=InProgress&runId=${{ env.QUICKCODE_RUN_ID }}"
          echo "Build started notification sent"

      - name: Build and Push Container
        id: build
        if: steps.changes.outputs.src == 'true'
        continue-on-error: true
        run: |-
          docker buildx build \
            --file ${{ env.DOCKER_FILE_PATH }}Dockerfile \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_REPO_NAME }}:${{ env.DOCKER_IMAGE_NAME }}${{ github.sha }}" \
            --push \
            src/
          
      - name: Build and Push Container Finished
        id: notify_build_done
        if: always()
        run: |
          curl -f -S --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject?projectName=${{ env.PROJECT_NAME }}&step=${{ env.BUILD_STEP_NAME }}&stepParameters=${{ env.STEP_PARAMS }}&isCompleted=true&message=Completed&runId=${{ env.QUICKCODE_RUN_ID }}"
          echo "Build finished notification sent"

      - name: Deploy to Cloud Run Started
        if: always()
        run: |
          curl -f -S --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject?projectName=${{ env.PROJECT_NAME }}&step=${{ env.DEPLOY_STEP_NAME }}&stepParameters=${{ env.STEP_PARAMS }}&isCompleted=false&message=InProgress&runId=${{ env.QUICKCODE_RUN_ID }}"
          echo "Deploy started notification sent"

      - name: Deploy to Cloud Run
        id: deploy
        if: steps.build.outcome == 'success'
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          env_vars: |
            ASPNETCORE_ENVIRONMENT=CloudRun 
            ASPNETCORE_URLS=http://+
            READ_CONNECTION_STRING=${{env.READ_CONNECTION_STRING}}
            WRITE_CONNECTION_STRING=${{env.WRITE_CONNECTION_STRING}}
            ELASTIC_CONNECTION_STRING=${{env.ELASTIC_CONNECTION_STRING}}
            DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP3SUPPORT=false 
            QUICKCODE_PROJECT_KEY=${{env.PROJECT_NAME}}
            QUICKCODE_PORTAL_URL=https://${{env.PROJECT_NAME}}-portal.quickcode.net
            QUICKCODE_GATEWAY_JWT_PUBLIC_KEY=${{env.QUICKCODE_GATEWAY_JWT_PUBLIC_KEY}}
            BLOB_PROVIDER=${{env.BLOB_PROVIDER}}
            AZURE_ACCOUNT_NAME=${{env.AZURE_ACCOUNT_NAME}}
            AZURE_ACCOUNT_KEY=${{env.AZURE_ACCOUNT_KEY}}
            AZURE_BLOB_CONTAINER_NAME=${{env.AZURE_BLOB_CONTAINER_NAME}}
            R2_ACCOUNT_ID=${{env.R2_ACCOUNT_ID}}
            R2_ACCESS_KEY_ID=${{env.R2_ACCESS_KEY_ID}}
            R2_SECRET_ACCESS_KEY=${{env.R2_SECRET_ACCESS_KEY}}
            R2_BUCKET=${{env.R2_BUCKET}}
            R2_PUBLIC_BASE_URL=${{env.R2_PUBLIC_BASE_URL}}
            R2_KEY_PREFIX=${{env.R2_KEY_PREFIX}}
            
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_REPO_NAME }}:${{ env.DOCKER_IMAGE_NAME }}${{ github.sha }}
          flags: |
            --port=80
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=512Mi
            --timeout=300
      - name: Deploy to Cloud Run Finished
        id: notify_deploy_done
        if: always()
        run: |
          curl -f -S --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject?projectName=${{ env.PROJECT_NAME }}&step=${{ env.DEPLOY_STEP_NAME }}&stepParameters=${{ env.STEP_PARAMS }}&isCompleted=true&message=Deployed&runId=${{ env.QUICKCODE_RUN_ID }}"
          echo "Deploy finished notification sent"

      - name: Notify job completed (fallback)
        if: always() && (steps.notify_build_done.outcome == 'failure' || steps.notify_deploy_done.outcome == 'failure')
        run: |
          for i in 1 2 3; do
            curl -f -S --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 3 "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject?projectName=${{ env.PROJECT_NAME }}&step=${{ env.BUILD_STEP_NAME }}&stepParameters=${{ env.STEP_PARAMS }}&isCompleted=true&message=Completed&runId=${{ env.QUICKCODE_RUN_ID }}" && \
            curl -f -S --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 3 "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject?projectName=${{ env.PROJECT_NAME }}&step=${{ env.DEPLOY_STEP_NAME }}&stepParameters=${{ env.STEP_PARAMS }}&isCompleted=true&message=Deployed&runId=${{ env.QUICKCODE_RUN_ID }}" && break
            sleep 5
          done
        continue-on-error: true
          
      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}

