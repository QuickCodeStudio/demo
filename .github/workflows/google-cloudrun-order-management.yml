name: "OrderManagementModule - Build and Deploy"

on:
  workflow_call:
 
env:
  PROJECT_ID: main-quickcode
  PROJECT_NAME: demo
  GAR_LOCATION: europe-west1
  SERVICE: demo-order-management
  REGION: europe-west1
  REPO: main-quickcode-docker-repo
  DOCKER_IMAGE_NAME: 'demo_order-management_'
  DOCKER_REPO_NAME: api
  DOCKER_FILE_PATH: 'src/Modules/OrderManagementModule/Presentation/QuickCode.Demo.OrderManagementModule.Api/'
  WIF_PROVIDER: ${{ secrets.WIF_PROVIDER }}
  WIF_SERVICE_ACCOUNT: ${{ secrets.WIF_SERVICE_ACCOUNT }}
  QUICKCODE_SESSION_ID: ${{ secrets.QUICKCODE_SESSION_ID }}
  QUICKCODE_RUN_ID: ${{ secrets.QUICKCODE_RUN_ID }}
  BUILD_STEP_NAME: BuildAndPushContainerModuleApi
  DEPLOY_STEP_NAME: DeployToCloudRunModuleApi
  STEP_PARAMS: OrderManagementModule
  READ_CONNECTION_STRING: "Data Source=${{ secrets.QUICKCODE_MSSQL_HOST }};Initial Catalog=demo__order_management;User ID=${{ secrets.QUICKCODE_MSSQL_USER }};Password=${{ secrets.QUICKCODE_MSSQL_PASSWORD }};TrustServerCertificate=True;"
  WRITE_CONNECTION_STRING: "Data Source=${{ secrets.QUICKCODE_MSSQL_HOST }};Initial Catalog=demo__order_management;User ID=${{ secrets.QUICKCODE_MSSQL_USER }};Password=${{ secrets.QUICKCODE_MSSQL_PASSWORD }};TrustServerCertificate=True;"
  ELASTIC_CONNECTION_STRING: ${{ secrets.QUICKCODE_ELASTIC }}
  QUICKCODE_GATEWAY_JWT_PUBLIC_KEY: ${{secrets.QUICKCODE_GATEWAY_JWT_PUBLIC_KEY}}
  BLOB_PROVIDER: ${{ secrets.BLOB_PROVIDER }}
  AZURE_ACCOUNT_NAME: ${{ secrets.AZURE_ACCOUNT_NAME }}
  AZURE_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY }}
  AZURE_BLOB_CONTAINER_NAME: ${{ secrets.AZURE_BLOB_CONTAINER_NAME }}
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET: ${{ secrets.R2_BUCKET }}
  R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
  R2_KEY_PREFIX: ${{ secrets.R2_KEY_PREFIX }}
  
jobs:
  deploy:
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            src:
              - '.github/**'
              - 'src/Shared/**'
              - 'src/Modules/OrderManagementModule/**'

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ env.WIF_PROVIDER }}' # e.g. - projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: '${{ env.WIF_SERVICE_ACCOUNT }}' 
          
      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v3'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'
      
      - name: Build and Push Container Started
        if: always()
        run: |
          curl -f -S --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject?projectName=${{ env.PROJECT_NAME }}&step=${{ env.BUILD_STEP_NAME }}&stepParameters=${{ env.STEP_PARAMS }}&isCompleted=false&message=InProgress&runId=${{ env.QUICKCODE_RUN_ID }}"
          echo "Build started notification sent"

      # continue-on-error: keep notify steps running and Complete Deployments reachable.
      # Failure is reported via message=Error:... (IsFailedActionOutput), not via red job alone.
      - name: Build and Push Container
        id: build
        if: steps.changes.outputs.src == 'true'
        continue-on-error: true
        run: |-
          docker buildx build \
            --file ${{ env.DOCKER_FILE_PATH }}Dockerfile \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_REPO_NAME }}:${{ env.DOCKER_IMAGE_NAME }}${{ github.sha }}" \
            --push \
             src/
          
      - name: Build and Push Container Finished
        id: notify_build_done
        if: always()
        run: |
          # Backend treats only messages starting with "Error:" as failures.
          STATUS_MSG="Error: Docker build failed"
          if [ "${{ steps.build.outcome }}" = "success" ]; then STATUS_MSG="Completed"; fi
          if [ "${{ steps.build.outcome }}" = "skipped" ]; then STATUS_MSG="Skipped"; fi
          curl -f -S --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 --get \
            --data-urlencode "projectName=${{ env.PROJECT_NAME }}" \
            --data-urlencode "step=${{ env.BUILD_STEP_NAME }}" \
            --data-urlencode "stepParameters=${{ env.STEP_PARAMS }}" \
            --data-urlencode "isCompleted=true" \
            --data-urlencode "message=${STATUS_MSG}" \
            --data-urlencode "runId=${{ env.QUICKCODE_RUN_ID }}" \
            "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject"
          echo "Build finished notification sent (${STATUS_MSG})"

      - name: Deploy to Cloud Run Started
        if: always()
        run: |
          curl -f -S --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject?projectName=${{ env.PROJECT_NAME }}&step=${{ env.DEPLOY_STEP_NAME }}&stepParameters=${{ env.STEP_PARAMS }}&isCompleted=false&message=InProgress&runId=${{ env.QUICKCODE_RUN_ID }}"
          echo "Deploy started notification sent"

      - name: Deploy to Cloud Run
        id: deploy
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/deploy-cloudrun@v1
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          env_vars: |
            ASPNETCORE_ENVIRONMENT=CloudRun 
            ASPNETCORE_URLS=http://+
            READ_CONNECTION_STRING=${{env.READ_CONNECTION_STRING}}
            WRITE_CONNECTION_STRING=${{env.WRITE_CONNECTION_STRING}}
            DB_TYPE=mssql
            DB_HOST=${{ secrets.QUICKCODE_MSSQL_HOST }}
            DB_PORT=1433
            DB_USERNAME=${{ secrets.QUICKCODE_MSSQL_USER }}
            DB_PASSWORD=${{ secrets.QUICKCODE_MSSQL_PASSWORD }}
            DB_DATABASE=demo__order_management
            MODULE_NAME=OrderManagementModule
            ELASTIC_CONNECTION_STRING=${{env.ELASTIC_CONNECTION_STRING}}
            DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP3SUPPORT=false 
            QUICKCODE_PROJECT_KEY=${{env.PROJECT_NAME}}
            QUICKCODE_PORTAL_URL=https://${{env.PROJECT_NAME}}-portal.quickcode.net
            QUICKCODE_GATEWAY_JWT_PUBLIC_KEY=${{env.QUICKCODE_GATEWAY_JWT_PUBLIC_KEY}}
            BLOB_PROVIDER=${{env.BLOB_PROVIDER}}
            AZURE_ACCOUNT_NAME=${{env.AZURE_ACCOUNT_NAME}}
            AZURE_ACCOUNT_KEY=${{env.AZURE_ACCOUNT_KEY}}
            AZURE_BLOB_CONTAINER_NAME=${{env.AZURE_BLOB_CONTAINER_NAME}}
            R2_ACCOUNT_ID=${{env.R2_ACCOUNT_ID}}
            R2_ACCESS_KEY_ID=${{env.R2_ACCESS_KEY_ID}}
            R2_SECRET_ACCESS_KEY=${{env.R2_SECRET_ACCESS_KEY}}
            R2_BUCKET=${{env.R2_BUCKET}}
            R2_PUBLIC_BASE_URL=${{env.R2_PUBLIC_BASE_URL}}
            R2_KEY_PREFIX=${{env.R2_KEY_PREFIX}}
            
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ env.DOCKER_REPO_NAME }}:${{ env.DOCKER_IMAGE_NAME }}${{ github.sha }}
          flags: |
            --port=80
            --allow-unauthenticated
            --min=0
            --max=1
            --min-instances=0
            --max-instances=1
            --cpu=1
            --memory=512Mi
            --timeout=300
      - name: Deploy to Cloud Run Finished
        id: notify_deploy_done
        if: always()
        run: |
          # Backend treats only messages starting with "Error:" as failures.
          STATUS_MSG="Error: Cloud Run deploy failed"
          if [ "${{ steps.deploy.outcome }}" = "success" ]; then STATUS_MSG="Deployed"; fi
          if [ "${{ steps.deploy.outcome }}" = "skipped" ]; then
            if [ "${{ steps.build.outcome }}" = "failure" ]; then
              STATUS_MSG="Error: Skipped because build failed"
            elif [ "${{ steps.build.outcome }}" = "skipped" ]; then
              STATUS_MSG="Skipped"
            else
              STATUS_MSG="Error: Skipped because build did not succeed"
            fi
          fi
          curl -f -S --connect-timeout 15 --max-time 60 --retry 3 --retry-delay 5 --get \
            --data-urlencode "projectName=${{ env.PROJECT_NAME }}" \
            --data-urlencode "step=${{ env.DEPLOY_STEP_NAME }}" \
            --data-urlencode "stepParameters=${{ env.STEP_PARAMS }}" \
            --data-urlencode "isCompleted=true" \
            --data-urlencode "message=${STATUS_MSG}" \
            --data-urlencode "runId=${{ env.QUICKCODE_RUN_ID }}" \
            "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject"
          echo "Deploy finished notification sent (${STATUS_MSG})"

      - name: Notify job completed (fallback)
        if: always() && (steps.notify_build_done.outcome == 'failure' || steps.notify_deploy_done.outcome == 'failure')
        run: |
          for i in 1 2 3; do
            curl -f -S --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 3 --get \
              --data-urlencode "projectName=${{ env.PROJECT_NAME }}" \
              --data-urlencode "step=${{ env.BUILD_STEP_NAME }}" \
              --data-urlencode "stepParameters=${{ env.STEP_PARAMS }}" \
              --data-urlencode "isCompleted=true" \
              --data-urlencode "message=Error: Build notification failed" \
              --data-urlencode "runId=${{ env.QUICKCODE_RUN_ID }}" \
              "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject" && \
            curl -f -S --connect-timeout 15 --max-time 30 --retry 2 --retry-delay 3 --get \
              --data-urlencode "projectName=${{ env.PROJECT_NAME }}" \
              --data-urlencode "step=${{ env.DEPLOY_STEP_NAME }}" \
              --data-urlencode "stepParameters=${{ env.STEP_PARAMS }}" \
              --data-urlencode "isCompleted=true" \
              --data-urlencode "message=Error: Deploy notification failed" \
              --data-urlencode "runId=${{ env.QUICKCODE_RUN_ID }}" \
              "https://api.quickcode.net/api/GenerateSite/UpdateGeneratorActionByProject" && break
            sleep 5
          done
        continue-on-error: true
          
      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}

