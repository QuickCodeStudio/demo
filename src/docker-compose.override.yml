services:
  quickcode-demo-gateway-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PRIVATE_KEY=${GATEWAY_JWT_PRIVATE_KEY}
      - GATEWAY_INTERNAL_TOKEN_KEY=${GATEWAY_INTERNAL_TOKEN_KEY}
    ports:
      - "${GATEWAY_PORT:-6060}:80"

  quickcode-demo-finance-settlement-api:
    env_file:
      - .env
    environment:
      - PORT=80
      - MODULE_NAME=FinanceSettlementModule
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      - GATEWAY_JWT_PRIVATE_KEY=${GATEWAY_JWT_PRIVATE_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=quickcode-kafka:9092
      - IDENTITY_MODULE_API=http://quickcode-demo-identity-api/
      - CORS_ALLOW_ORIGINS=http://localhost:3000,http://localhost:${GATEWAY_PORT:-6060},http://quickcode-demo-gateway-api,https://*.quickcode.net,https://*.europe-west1.run.app
      - ELASTIC_CONNECTION_STRING=${ELASTIC_CONNECTION_STRING:-}
      - Otlp__Endpoint=${Otlp__Endpoint:-http://localhost:4317}
    ports:
      - "6201:80"

  quickcode-demo-order-management-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      
      
    ports:
      - "6202:80"

  quickcode-demo-pricing-engine-api:
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=80
      - MODULE_NAME=PricingEngineModule
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      - GATEWAY_JWT_PRIVATE_KEY=${GATEWAY_JWT_PRIVATE_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=quickcode-kafka:9092
      - IDENTITY_MODULE_API=http://quickcode-demo-identity-api/
      - CORS_ALLOW_ORIGINS=http://localhost:3000,http://localhost:${GATEWAY_PORT:-6060},http://quickcode-demo-gateway-api,https://*.quickcode.net,https://*.europe-west1.run.app
      - ELASTIC_CONNECTION_STRING=${ELASTIC_CONNECTION_STRING:-}
      - Otlp__Endpoint=${Otlp__Endpoint:-http://localhost:4317}
    ports:
      - "6203:80"

  quickcode-demo-product-catalog-api:
    env_file:
      - .env
    environment:
      - RUST_LOG=debug
      - PORT=80
      - MODULE_NAME=ProductCatalogModule
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      - GATEWAY_JWT_PRIVATE_KEY=${GATEWAY_JWT_PRIVATE_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=quickcode-kafka:9092
      - IDENTITY_MODULE_API=http://quickcode-demo-identity-api/
      - CORS_ALLOW_ORIGINS=http://localhost:3000,http://localhost:${GATEWAY_PORT:-6060},http://quickcode-demo-gateway-api,https://*.quickcode.net,https://*.europe-west1.run.app
      - ELASTIC_CONNECTION_STRING=${ELASTIC_CONNECTION_STRING:-}
      - Otlp__Endpoint=${Otlp__Endpoint:-http://localhost:4317}
    ports:
      - "6204:80"

  quickcode-demo-seller-management-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      
      
    ports:
      - "6205:80"

  quickcode-demo-identity-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      - USER_JWT_PRIVATE_KEY=${USER_JWT_PRIVATE_KEY}
      - QUICKCODE_EMAIL_API_KEY=${QUICKCODE_EMAIL_API_KEY}
    ports:
      - "6206:80"

#[-WEB-]
  quickcode-demo-portal:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - BLOB_PROVIDER=${BLOB_PROVIDER:-azure}
      - AZURE_ACCOUNT_NAME=${AZURE_ACCOUNT_NAME:-quickcodeblobstorage}
      - AZURE_ACCOUNT_KEY=${AZURE_ACCOUNT_KEY}
      - AZURE_BLOB_CONTAINER_NAME=${AZURE_BLOB_CONTAINER_NAME:-images}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET:-quickcode-images}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
      - R2_KEY_PREFIX=${R2_KEY_PREFIX}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-quickcode-images}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL}
      - LOCAL_PUBLIC_BASE_URL=${LOCAL_PUBLIC_BASE_URL:-/uploads}
    ports:
      - "${PORTAL_PORT:-6020}:80"
      
  quickcode-demo-event-listener-service:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_INTERNAL_TOKEN_KEY=${GATEWAY_INTERNAL_TOKEN_KEY}
    ports:
      - "${EVENT_LISTENER_PORT:-6100}:80"

networks:
  default:
    name: ${COMPOSE_NETWORK_NAME:-quickcode-local}
    external: true
