services:
  demo-pg-data:
    ports:
      - "${PGSQL_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=dockerf
    volumes:
      - quickcode-demo-pg-data:/var/lib/postgresql
  
  demo-mysql-data:
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - quickcode-demo-mysql-data:/var/lib/mysql
      - "~/sql-scripts/setup.sql:/docker-entrypoint-initdb.d/1.sql"
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=RootDocker!
      - MYSQL_USER=docker
      - MYSQL_PASSWORD=dockerf

  demo-sql-data:
    environment:
      - MSSQL_SA_PASSWORD=Pass@word
      - ACCEPT_EULA=Y
      - MSSQL_PID=Developer
    ports:
      - "${SQL_PORT:-5433}:1433"
    volumes:
      - quickcode-demo-sql-data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  demo-elasticsearch:
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    deploy:
      resources:
        limits:
          memory: 1GB
    ports:
      - "${ELASTIC_PORT:-9200}:9200"
    volumes:
      - quickcode-demo-elasticsearch-data:/usr/share/elasticsearch/data
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test: curl -s http://demo-elasticsearch:9200 >/dev/null || exit 1
      interval: 10s
      timeout: 5s
      retries: 10

  demo-kibana:
    environment:
      - ELASTICSEARCH_HOSTS=http://demo-elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    volumes:
      - quickcode-demo-kibana-data:/usr/share/kibana/data
    restart: always
    depends_on:
      - demo-elasticsearch

  quickcode-demo-gateway-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PRIVATE_KEY=${GATEWAY_JWT_PRIVATE_KEY}
      - GATEWAY_INTERNAL_TOKEN_KEY=${GATEWAY_INTERNAL_TOKEN_KEY}
    ports:
      - "${GATEWAY_PORT:-6060}:80"

  quickcode-demo-identity-module-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      - USER_JWT_PRIVATE_KEY=${USER_JWT_PRIVATE_KEY}
    ports:
      - "6001:80"


  quickcode-demo-finance-settlement-module-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      
    ports:
      - "6002:80"


  quickcode-demo-order-management-module-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      
    ports:
      - "6003:80"


  quickcode-demo-pricing-engine-module-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      
    ports:
      - "6004:80"


  quickcode-demo-product-catalog-module-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      
    ports:
      - "6005:80"


  quickcode-demo-seller-management-module-api:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_JWT_PUBLIC_KEY=${GATEWAY_JWT_PUBLIC_KEY}
      
    ports:
      - "6006:80"


#[-WEB-]
  quickcode-demo-portal:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - BLOB_PROVIDER=${BLOB_PROVIDER:-azure}
      - AZURE_ACCOUNT_NAME=${AZURE_ACCOUNT_NAME:-quickcodeblobstorage}
      - AZURE_ACCOUNT_KEY=${AZURE_ACCOUNT_KEY}
      - AZURE_BLOB_CONTAINER_NAME=${AZURE_BLOB_CONTAINER_NAME:-images}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET=${R2_BUCKET:-quickcode-images}
      - R2_PUBLIC_BASE_URL=${R2_PUBLIC_BASE_URL}
      - R2_KEY_PREFIX=${R2_KEY_PREFIX}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-quickcode-images}
      - S3_PUBLIC_BASE_URL=${S3_PUBLIC_BASE_URL}
      - LOCAL_PUBLIC_BASE_URL=${LOCAL_PUBLIC_BASE_URL:-/uploads}
    ports:
      - "${PORTAL_PORT:-6020}:80"
      
  quickcode-demo-event-listener-service:
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - ASPNETCORE_URLS=http://+
      - GATEWAY_INTERNAL_TOKEN_KEY=${GATEWAY_INTERNAL_TOKEN_KEY}
    ports:
      - "${EVENT_LISTENER_PORT:-6100}:80"
      
volumes:
  quickcode-demo-pg-data:
    external: false
    
  quickcode-demo-mysql-data:
    external: false
    
  quickcode-demo-sql-data:
    external: false
    
  quickcode-demo-elasticsearch-data:
    external: false
    
  quickcode-demo-kibana-data:
    external: false
