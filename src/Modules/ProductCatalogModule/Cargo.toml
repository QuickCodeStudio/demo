[package]
name = "qc_product_catalog_module"
version = "1.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "quickcode_module"
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "swagger-dump"
path = "src/bin/swagger_dump.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Endpoint workflow YAML (kind: endpoint); 0.9.x MSRV is well below rustc 1.85.
serde_yaml = "0.9"
# uuid>=1.29 needs rustc 1.89; pin so rust185 Docker/image builds stay stable.
uuid = { version = "=1.16.0", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.28"
opentelemetry = { version = "0.27", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.27", default-features = false, features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
url = "2"
once_cell = "1"
regex = "1"
jsonwebtoken = "9"
base64 = "0.22"

sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "any",
  "postgres",
  "mysql",
  "chrono",
  "uuid",
  "json",
] }
tiberius = { version = "0.12", default-features = false, features = ["chrono", "tds73", "rustls"] }
tokio-util = { version = "0.7", features = ["compat"] }
# Concurrent workflow branches (parallel / foreach) — already a transitive dependency.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
# Pure-Rust Kafka client (Nest kafkajs / C# Confluent produce parity without librdkafka).
rskafka = "0.5"
